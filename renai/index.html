<script>
"use strict";

/* ═════════ 計測(任意・未設定なら何も送信しない) ═════════
   Supabase に結果を1行だけ記録する場合、下の url / key を埋める。
   送信するのは タイプ・愛の重さ・流入元 のみ。個人情報は送らない。

   テーブル作成SQL(Supabase SQL Editor で実行):
   ------------------------------------------------------------
   create table public.shindan_log (
     id         bigint generated always as identity primary key,
     app        text not null,
     kind       text not null,
     type       text,
     weight     int,
     ref        text,
     created_at timestamptz not null default now()
   );
   alter table public.shindan_log enable row level security;
   create policy "anon insert only" on public.shindan_log
     for insert to anon with check (true);
   ------------------------------------------------------------
   ※ INSERT のみ許可。SELECT を開けないこと(anonキーは公開されるため)
*/
const LOG = { url:"", key:"" };

async function track(kind, data){
  if(!LOG.url || !LOG.key) return;
  try{
    await fetch(LOG.url.replace(/\/+$/,"") + "/rest/v1/shindan_log", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        apikey: LOG.key,
        Authorization:"Bearer " + LOG.key,
        Prefer:"return=minimal"
      },
      body: JSON.stringify(Object.assign({ app:"renai", kind:kind }, data || {}))
    });
  }catch(e){ /* 計測失敗は診断の動作に影響させない */ }
}

/* ═════════ データ ═════════ */

function emblemMarkup(code, color, size){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="'+size+'" height="'+size+'">'+
         '<g fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+
         (EMBLEMS[code]||'')+'</g></svg>';
}

/* ═════════ 状態 ═════════ */

let order = [], answers = {}, cur = 0, current = null;
let themeColor = THEME_COLORS[1][1];
const REF = new URLSearchParams(location.search).get("from") || "";

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
};

function initSwatches(){
  const box = $("swatches");
  THEME_COLORS.forEach(([name,hex],i)=>{
    const b = document.createElement("button");
    b.className = "swatch";
    b.style.setProperty("--c",hex);
    b.setAttribute("aria-label", name);
    b.setAttribute("aria-pressed", i===1 ? "true" : "false");
    b.onclick = ()=>{
      document.querySelectorAll(".swatch").forEach(s=>s.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      themeColor = hex;
      document.documentElement.style.setProperty("--oshi",hex);
      if(current) renderEmblem(current.code);
    };
    box.appendChild(b);
  });
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ═════════ 診断フロー ═════════ */

function startQuiz(){
  order = shuffle([...QUESTIONS.keys()]);
  answers = {}; cur = 0;
  renderQ(); show("scr-quiz");
  track("start", { ref: REF });
}

function renderQ(){
  $("qcount").textContent = (cur+1)+" / "+order.length;
  $("pbar").style.width = ((cur/order.length)*100)+"%";
  $("qtext").textContent = QUESTIONS[order[cur]].t;
  $("btn-back").style.visibility = cur===0 ? "hidden" : "visible";
}

function answer(v){
  answers[order[cur]] = v;
  if(cur < order.length-1){ cur++; renderQ(); } else finish();
}

function calc(){
  const sums = {AM:0, DY:0, SK:0, IH:0};
  let wSum = 0;
  QUESTIONS.forEach((q,i)=>{
    const v = answers[i] ?? 0;
    if(q.axis==="W"){ wSum += (q.dir==="R" ? v : -v); return; }
    const first = AXES.find(a=>a.key===q.axis).first;
    sums[q.axis] += (q.dir===first ? v : -v);
  });
  let code = ""; const pcts = [];
  AXES.forEach(a=>{
    let s = sums[a.key];
    if(s===0){
      const repIdx = QUESTIONS.findIndex(q=>q.axis===a.key && q.rep);
      s = (answers[repIdx] ?? 1) > 0 ? 1 : -1;
    }
    code += s>0 ? a.first : a.key.replace(a.first,"");
    pcts.push(Math.round(((sums[a.key]+10)/20)*100));
  });
  return { code, pcts, w: Math.round(((wSum+8)/16)*100) };
}

function finish(){
  const r = calc();
  renderResult(r.code, r.pcts, r.w);
  const p = r.pcts.map(x=>String(x).padStart(2,"0")).join("");
  history.replaceState(null,"","?t="+r.code+"&p="+p+"&d="+r.w);
  show("scr-result");
  track("done", { type: r.code, weight: r.w, ref: REF });
}

/* ═════════ 結果表示 ═════════ */

function weightTitle(w){
  for(const [min,title] of WEIGHT_TITLES){ if(w>=min) return title; }
  return WEIGHT_TITLES[WEIGHT_TITLES.length-1][1];
}

/* img/{コード}.png があればそれを、無ければ内蔵エンブレムを使う */
function loadImg(src){
  return new Promise((res,rej)=>{
    const i = new Image();
    i.onload = ()=>res(i);
    i.onerror = rej;
    i.src = src;
  });
}
function typeVisual(code, color, px){
  return loadImg("img/"+code+".png?v=1").catch(()=>
    loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(emblemMarkup(code,color,px)))
  );
}
function renderEmblem(code){
  const box = $("emblem");
  box.innerHTML = emblemMarkup(code, themeColor, 132);
  loadImg("img/"+code+".png?v=1").then(img=>{
    box.innerHTML = "";
    img.alt = "";
    box.appendChild(img);
  }).catch(()=>{});
}

function renderResult(code, pcts, w){
  const t = TYPES[code];
  if(!t) return;
  current = { code, pcts, w };

  renderEmblem(code);
  $("rcode").textContent = code.split("").join(" ");
  $("rname").textContent = t.name;
  $("rcopy").textContent = t.copy;
  $("rdesc").textContent = t.desc;

  const axes = $("axes");
  axes.innerHTML = "";
  AXES.forEach((a,i)=>{
    const p = pcts[i];
    const div = document.createElement("div");
    div.className = "axis";
    div.innerHTML =
      '<div class="lbl"><span class="l">'+a.labels[0]+' '+p+'%</span>'+
      '<span class="r">'+a.labels[1]+' '+(100-p)+'%</span></div>'+
      '<div class="bar"><i style="width:'+p+'%"></i></div>';
    axes.appendChild(div);
  });

  $("wpct").textContent = w+"%";
  $("wtitle").textContent = weightTitle(w);
  $("wbar").style.width = w+"%";
  $("aisho").innerHTML = '相性◎のタイプ: <b>'+t.ai[0]+'「'+t.ai[1]+'」</b><br>'+t.ai[2];
}

/* ═════════ シェア ═════════ */

function shareUrl(){
  const {code,pcts,w} = current;
  const p = pcts.map(x=>String(x).padStart(2,"0")).join("");
  return location.origin + location.pathname + "?t="+code+"&p="+p+"&d="+w;
}

function shareX(){
  const t = TYPES[current.code];
  const text = '私は「'+t.name+'」('+current.code+') でした!\n'+
               '愛の重さ: '+current.w+'% '+weightTitle(current.w)+'\n'+
               '#恋愛16タイプ診断\n';
  window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+
              "&url="+encodeURIComponent(shareUrl()), "_blank");
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* 結果画像 1080×1350 */
async function saveImage(){
  try{ await document.fonts.ready; }catch(e){}
  const {code,pcts,w} = current;
  const t = TYPES[code];
  const cv = $("cv"), ctx = cv.getContext("2d");
  const W = 1080, H = 1350, c = themeColor;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#0e0b1a"; ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(W/2,-120,50, W/2,-120,980);
  g.addColorStop(0, c+"55"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = c; ctx.lineWidth = 4;
  ctx.strokeRect(40,40,W-80,H-80);

  ctx.textAlign = "center";
  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 26px 'Zen Kaku Gothic New'";
  ctx.fillText("恋 愛 16 タ イ プ 診 断", W/2, 120);

  /* エンブレム(またはPNG) */
  try{
    const vis = await typeVisual(code, c, 520);
    ctx.drawImage(vis, W/2-130, 170, 260, 260);
  }catch(e){ /* 画像が出せなくても以降は描画する */ }

  ctx.fillStyle = c;
  ctx.font = "700 34px 'Zen Kaku Gothic New'";
  ctx.fillText(code.split("").join("  "), W/2, 492);

  ctx.fillStyle = "#f2effa";
  ctx.shadowColor = c; ctx.shadowBlur = 30;
  ctx.font = "68px 'Dela Gothic One'";
  ctx.fillText(t.name, W/2, 572);
  ctx.shadowBlur = 0;

  ctx.fillStyle = c;
  ctx.font = "700 30px 'Zen Kaku Gothic New'";
  ctx.fillText(t.copy, W/2, 638);

  const barX = 140, barW = W-280, barH = 18;
  let y = 720;
  AXES.forEach((a,i)=>{
    const p = pcts[i];
    ctx.textAlign = "left";
    ctx.fillStyle = "#f2effa";
    ctx.font = "700 26px 'Zen Kaku Gothic New'";
    ctx.fillText(a.labels[0]+" "+p+"%", barX, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#8d86a8";
    ctx.fillText(a.labels[1]+" "+(100-p)+"%", barX+barW, y);
    ctx.fillStyle = "#241c40";
    roundRect(ctx, barX, y+14, barW, barH, 9); ctx.fill();
    ctx.fillStyle = c;
    roundRect(ctx, barX, y+14, Math.max(barW*p/100, barH), barH, 9); ctx.fill();
    y += 84;
  });

  ctx.textAlign = "left";
  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 26px 'Zen Kaku Gothic New'";
  ctx.fillText("愛の重さ", barX, 1064);
  ctx.fillStyle = c;
  ctx.font = "56px 'Dela Gothic One'";
  ctx.fillText(w+"%", barX, 1130);
  ctx.fillStyle = "#f2effa";
  ctx.font = "700 27px 'Zen Kaku Gothic New'";
  ctx.fillText(weightTitle(w), barX+170, 1126);
  ctx.fillStyle = "#241c40";
  roundRect(ctx, barX, 1154, barW, barH, 9); ctx.fill();
  ctx.fillStyle = c;
  roundRect(ctx, barX, 1154, Math.max(barW*w/100, barH), barH, 9); ctx.fill();

  /* 相性◎(リプ欄が伸びる仕掛け) */
  ctx.textAlign = "center";
  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 24px 'Zen Kaku Gothic New'";
  ctx.fillText("相性◎のタイプ", W/2, 1210);
  ctx.fillStyle = "#f2effa";
  ctx.font = "700 30px 'Zen Kaku Gothic New'";
  ctx.fillText(t.ai[0] + "\u3000" + t.ai[1], W/2, 1246);

  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 24px 'Zen Kaku Gothic New'";
  ctx.fillText("#恋愛16タイプ診断", W/2, 1288);

  const a = document.createElement("a");
  a.download = "renai_"+code+".png";
  a.href = cv.toDataURL("image/png");
  a.click();
}

/* ═════════ シェアURLからの直リンク ═════════ */

function tryLoadFromUrl(){
  const q = new URLSearchParams(location.search);
  const code = q.get("t"), p = q.get("p"), d = q.get("d");
  if(!code || !TYPES[code] || !p || p.length!==8 || d===null) return false;
  const pcts = [0,1,2,3].map(i=>{
    const n = parseInt(p.slice(i*2,i*2+2),10);
    return isNaN(n) ? 50 : Math.min(100,Math.max(0,n));
  });
  const wv = Math.min(100, Math.max(0, parseInt(d,10)||0));
  renderResult(code, pcts, wv);
  $("btn-x").style.display = "none";
  $("btn-retry").textContent = "自分も診断してみる";
  show("scr-result");
  return true;
}

/* ═════════ イベント ═════════ */

initSwatches();
$("btn-start").onclick = startQuiz;
document.querySelectorAll(".ans").forEach(b=>{
  b.onclick = ()=>answer(parseInt(b.dataset.v,10));
});
$("btn-back").onclick = ()=>{ if(cur>0){ cur--; renderQ(); } };
$("btn-x").onclick = shareX;
$("btn-img").onclick = saveImage;
$("btn-retry").onclick = ()=>{
  history.replaceState(null,"",location.pathname);
  $("btn-x").style.display = "";
  $("btn-retry").textContent = "もう一度診断する";
  show("scr-start");
};
tryLoadFromUrl();
</script>
