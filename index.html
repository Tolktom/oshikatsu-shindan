<style>
:root{
  --bg:#0e0b1a;
  --card:#1a1530;
  --card2:#241c40;
  --text:#f2effa;
  --muted:#8d86a8;
  --line:#332a55;
  --oshi:#ff4d9e; /* デフォルト推し色 */
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  min-height:100svh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--oshi) 18%, transparent), transparent),
    radial-gradient(ellipse 60% 40% at 90% 110%, color-mix(in srgb, var(--oshi) 10%, transparent), transparent);
  transition:background-image .4s;
}
.wrap{max-width:520px;margin:0 auto;padding:28px 20px 64px}
.screen{display:none}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen.active{animation:none}}

/* ---------- start ---------- */
.eyebrow{
  font-size:12px;letter-spacing:.24em;color:var(--oshi);
  font-weight:700;text-align:center;margin-bottom:14px;
}
h1{
  font-family:"Dela Gothic One",sans-serif;
  font-size:clamp(30px,9vw,44px);
  line-height:1.25;text-align:center;font-weight:400;
  text-shadow:0 0 24px color-mix(in srgb, var(--oshi) 45%, transparent);
}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-top:14px;line-height:1.9}
.colorpick{margin-top:36px}
.colorpick p{font-size:13px;font-weight:700;text-align:center;margin-bottom:14px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;justify-items:center}
.swatch{
  width:46px;height:46px;border-radius:50%;border:3px solid transparent;
  cursor:pointer;transition:transform .15s;
  box-shadow:0 0 14px color-mix(in srgb, var(--c) 55%, transparent);
  background:var(--c);
}
.swatch:active{transform:scale(.92)}
.swatch[aria-pressed="true"]{border-color:#fff;transform:scale(1.12)}
.btn{
  display:block;width:100%;margin-top:34px;padding:18px;
  background:var(--oshi);color:#fff;border:none;border-radius:999px;
  font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 28px color-mix(in srgb, var(--oshi) 50%, transparent);
  transition:transform .12s;
  text-align:center;text-decoration:none;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.note{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center}

/* ---------- quiz ---------- */
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.qcount{font-size:13px;font-weight:700;color:var(--oshi);min-width:56px}
.bar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--oshi);border-radius:99px;transition:width .25s;box-shadow:0 0 10px var(--oshi)}
.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px 24px;min-height:150px;display:flex;align-items:center;
}
.qtext{font-size:18px;font-weight:700;line-height:1.75}
.answers{display:grid;gap:12px;margin-top:24px}
.ans{
  padding:16px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--text);font-family:inherit;
  font-size:15px;font-weight:500;cursor:pointer;text-align:center;
  transition:border-color .15s, background .15s, transform .1s;
}
.ans:active{transform:scale(.98)}
.ans:hover{border-color:var(--oshi)}
.back{
  margin-top:22px;background:none;border:none;color:var(--muted);
  font-family:inherit;font-size:13px;cursor:pointer;padding:8px;
}

/* ---------- result ---------- */
.rcard{
  background:linear-gradient(160deg, var(--card2), var(--card));
  border:1px solid color-mix(in srgb, var(--oshi) 55%, var(--line));
  border-radius:22px;padding:32px 24px;
  box-shadow:0 0 40px color-mix(in srgb, var(--oshi) 22%, transparent);
}
.rlabel{font-size:11px;letter-spacing:.22em;color:var(--muted);text-align:center;font-weight:700}
.rcode{
  text-align:center;font-size:14px;font-weight:700;color:var(--oshi);
  letter-spacing:.35em;margin-top:14px;
}
.rname{
  font-family:"Dela Gothic One",sans-serif;font-weight:400;
  font-size:clamp(26px,7.6vw,34px);text-align:center;line-height:1.4;margin-top:6px;
  text-shadow:0 0 20px color-mix(in srgb, var(--oshi) 40%, transparent);
}
.rcopy{text-align:center;color:var(--oshi);font-size:14px;font-weight:700;margin-top:12px}
.rdesc{font-size:14px;line-height:2;color:var(--text);margin-top:18px}
.axes{margin-top:26px;display:grid;gap:14px}
.axis .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.axis .lbl .l{color:var(--text)} .axis .lbl .r{color:var(--muted)}
.axis .bar{height:10px}
.doutan{
  margin-top:26px;padding:18px;border-radius:14px;
  background:color-mix(in srgb, var(--oshi) 10%, var(--card));
  border:1px dashed color-mix(in srgb, var(--oshi) 50%, var(--line));
}
.doutan .t{font-size:12px;font-weight:700;color:var(--muted)}
.doutan .v{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.doutan .pct{font-family:"Dela Gothic One",sans-serif;font-size:34px;color:var(--oshi)}
.doutan .title{font-size:15px;font-weight:700}
.aisho{margin-top:22px;font-size:13.5px;line-height:1.9;color:var(--muted)}
.aisho b{color:var(--text)}
.share{margin-top:30px;display:grid;gap:12px}
canvas{display:none}
footer{margin-top:44px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>

<div class="wrap">

  <!-- スタート画面 -->
  <section class="screen active" id="scr-start">
    <p class="eyebrow">OSHIKATSU 16 TYPES</p>
    <h1>推し活<br>16タイプ診断</h1>
    <p class="sub">24問・約2分。<br>あなたの推し方タイプと<br>「同担拒否度」がわかる。</p>

  <section class="screen" id="scr-quiz">
    <div class="progress-row">

      <div class="bar"><i id="pbar"></i></div>
    </div>
    <div class="qcard"><p class="qtext" id="qtext"></p></div>
    <div class="answers">

    </div>

  </section>

  <!-- 結果画面 -->
  <section class="screen" id="scr-result">
    <div class="rcard" id="rcard">
      <p class="rlabel">あなたの推し活タイプ</p>
      <p class="rcode" id="rcode"></p>
      <p class="rname" id="rname"></p>
      <p class="rcopy" id="rcopy"></p>
      <p class="rdesc" id="rdesc"></p>
      <div class="axes" id="axes"></div>

        <div class="v"><span class="pct" id="dpct"></span><span class="title" id="dtitle"></span></div>
        <div class="bar" style="margin-top:10px"><i id="dbar" style="width:0"></i></div>
      </div>
      <p class="aisho" id="aisho"></p>
    </div>
    <div class="share">
      <button class="btn" id="btn-x">Xで結果をシェア</button>
      <button class="btn ghost" id="btn-img">結果画像を保存</button>
      <button class="btn ghost" id="btn-retry">もう一度診断する</button>
      <a class="btn ghost" href="renai/?from=oshi">恋愛版もやってみる →</a>
    </div>
    <p class="note">画像を保存してポストに添付すると、結果がそのまま表示されます。</p>
    <footer>#推し活16タイプ診断</footer>
  </section>

</div>

const DOUTAN_TITLES = [
  [85,"同担拒否ガチ勢🔥"],[60,"やや拒否(視界には入れたくない)"],
  [40,"中立(住み分けできれば無)"],[15,"同担歓迎(語れる仲間求む)"],[0,"全人類同担化計画"]
];

/* ================= 状態 ================= */

let order = [];      // シャッフル後の質問index配列
let answers = {};    // 質問index -> 回答値(2/1/-1/-2)
let cur = 0;
let oshiColor = OSHI_COLORS[1][1];

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
};

/* ================= 初期化 ================= */

function initSwatches(){
  const box = $("swatches");
  OSHI_COLORS.forEach(([name,hex],i)=>{
    const b = document.createElement("button");
    b.className = "swatch";
    b.style.setProperty("--c",hex);
    b.setAttribute("aria-label", name);
    b.setAttribute("aria-pressed", i===1 ? "true" : "false");
    b.onclick = ()=>{
      document.querySelectorAll(".swatch").forEach(s=>s.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      oshiColor = hex;
      document.documentElement.style.setProperty("--oshi",hex);
    };
    box.appendChild(b);
  });
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ================= 計測(任意・未設定なら何も送信しない) ================= */
/* Supabase に記録する場合のみ url / key を埋める。恋愛版と同じテーブルを使う。
   送信するのは タイプ・同担拒否度・流入元 のみ。個人情報は送らない。 */
const LOG = { url:"", key:"" };
const REF = new URLSearchParams(location.search).get("from") || "";

async function track(kind, data){
  if(!LOG.url || !LOG.key) return;
  try{
    await fetch(LOG.url.replace(/\/+$/,"") + "/rest/v1/shindan_log", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        apikey: LOG.key,
        Authorization:"Bearer " + LOG.key,
        Prefer:"return=minimal"
      },
      body: JSON.stringify(Object.assign({ app:"oshi", kind:kind }, data || {}))
    });
  }catch(e){ /* 計測失敗は診断の動作に影響させない */ }
}

/* ================= 診断フロー ================= */

function startQuiz(){
  order = shuffle([...QUESTIONS.keys()]);
  answers = {};
  cur = 0;
  renderQ();
  show("scr-quiz");
  track("start", { ref: REF });
}

function renderQ(){
  $("qcount").textContent = `${cur+1} / ${order.length}`;
  $("pbar").style.width = `${(cur/order.length)*100}%`;
  $("qtext").textContent = QUESTIONS[order[cur]].t;
  $("btn-back").style.visibility = cur===0 ? "hidden" : "visible";
}

function answer(v){
  answers[order[cur]] = v;
  if(cur < order.length-1){ cur++; renderQ(); }
  else finish();
}

function calc(){
  // 4軸: 第一極方向の合計(-10〜+10)
  const sums = {GZ:0, EK:0, FH:0, TM:0};
  let dSum = 0; // 拒否方向(-8〜+8)
  QUESTIONS.forEach((q,i)=>{
    const v = answers[i] ?? 0;
    if(q.axis==="D"){ dSum += (q.dir==="R" ? v : -v); return; }
    const first = AXES.find(a=>a.key===q.axis).first;
    sums[q.axis] += (q.dir===first ? v : -v);
  });

  let code = "";
  const pcts = [];
  AXES.forEach(a=>{
    let s = sums[a.key];
    if(s===0){
      // 同点: 代表質問の回答側で決定
      const repIdx = QUESTIONS.findIndex(q=>q.axis===a.key && q.rep);
      s = (answers[repIdx] ?? 1) > 0 ? 1 : -1;
    }
    const second = a.key.replace(a.first,"");
    code += s>0 ? a.first : second;
    pcts.push(Math.round(((sums[a.key]+10)/20)*100)); // 第一極%
  });

  const d = Math.round(((dSum+8)/16)*100);
  return {code, pcts, d};
}

function finish(){
  const r = calc();
  renderResult(r.code, r.pcts, r.d);
  const p = r.pcts.map(x=>String(x).padStart(2,"0")).join("");
  history.replaceState(null,"",`?t=${r.code}&p=${p}&d=${r.d}`);
  show("scr-result");
  track("done", { type: r.code, weight: r.d, ref: REF });
}

/* ================= 結果表示 ================= */

let current = null; // {code,pcts,d} 共有画像用

function doutanTitle(d){
  for(const [min,title] of DOUTAN_TITLES){ if(d>=min) return title; }
  return DOUTAN_TITLES[DOUTAN_TITLES.length-1][1];
}

function renderResult(code, pcts, d){
  const t = TYPES[code];
  if(!t) return;
  current = {code, pcts, d};

  $("rcode").textContent = code.split("").join(" ");
  $("rname").textContent = t.name;
  $("rcopy").textContent = t.copy;
  $("rdesc").textContent = t.desc;

  const axes = $("axes");
  axes.innerHTML = "";
  AXES.forEach((a,i)=>{
    const p = pcts[i];
    const div = document.createElement("div");
    div.className = "axis";
    div.innerHTML =
      `<div class="lbl"><span class="l">${a.labels[0]} ${p}%</span>`+
      `<span class="r">${a.labels[1]} ${100-p}%</span></div>`+
      `<div class="bar"><i style="width:${p}%"></i></div>`;
    axes.appendChild(div);
  });

  $("dpct").textContent = d+"%";
  $("dtitle").textContent = doutanTitle(d);
  $("dbar").style.width = d+"%";

  $("aisho").innerHTML =
    `相性◎のタイプ: <b>${t.ai[0]}「${t.ai[1]}」</b><br>${t.ai[2]}`;
}

/* ================= シェア ================= */

function shareUrl(){
  const {code,pcts,d} = current;
  const p = pcts.map(x=>String(x).padStart(2,"0")).join("");
  return `${location.origin}${location.pathname}?t=${code}&p=${p}&d=${d}`;
}

function shareX(){
  const t = TYPES[current.code];
  const text =
    `私は「${t.name}」(${current.code}) でした!\n`+
    `同担拒否度: ${current.d}% ${doutanTitle(current.d)}\n`+
    `#推し活16タイプ診断\n`;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl())}`;
  window.open(url,"_blank");
}

/* 結果画像生成(1080x1080) */
async function saveImage(){
  await document.fonts.ready;
  const {code,pcts,d} = current;
  const t = TYPES[code];
  const cv = $("cv"), ctx = cv.getContext("2d");
  const W = 1080, H = 1080;
  const oshi = oshiColor;

  // 背景
  ctx.fillStyle = "#0e0b1a";
  ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(W/2,-100,50, W/2,-100,900);
  g.addColorStop(0, oshi+"55");
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // 枠
  ctx.strokeStyle = oshi;
  ctx.lineWidth = 4;
  ctx.strokeRect(40,40,W-80,H-80);

  ctx.textAlign = "center";

  // ヘッダ
  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 26px 'Zen Kaku Gothic New'";
  ctx.fillText("推 し 活 16 タ イ プ 診 断", W/2, 130);

  // コード
  ctx.fillStyle = oshi;
  ctx.font = "700 34px 'Zen Kaku Gothic New'";
  ctx.fillText(code.split("").join("  "), W/2, 205);

  // タイプ名
  ctx.fillStyle = "#f2effa";
  ctx.shadowColor = oshi; ctx.shadowBlur = 30;
  ctx.font = "72px 'Dela Gothic One'";
  ctx.fillText(t.name, W/2, 300);
  ctx.shadowBlur = 0;

  // コピー
  ctx.fillStyle = oshi;
  ctx.font = "700 30px 'Zen Kaku Gothic New'";
  ctx.fillText(t.copy, W/2, 365);

  // 軸バー
  const barX = 140, barW = W-280, barH = 18;
  let y = 450;
  ctx.textAlign = "left";
  AXES.forEach((a,i)=>{
    const p = pcts[i];
    ctx.fillStyle = "#f2effa";
    ctx.font = "700 26px 'Zen Kaku Gothic New'";
    ctx.fillText(`${a.labels[0]} ${p}%`, barX, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#8d86a8";
    ctx.fillText(`${a.labels[1]} ${100-p}%`, barX+barW, y);
    ctx.textAlign = "left";
    ctx.fillStyle = "#241c40";
    roundRect(ctx, barX, y+14, barW, barH, 9); ctx.fill();
    ctx.fillStyle = oshi;
    roundRect(ctx, barX, y+14, Math.max(barW*p/100, barH), barH, 9); ctx.fill();
    y += 84;
  });

  // 同担拒否度
  y += 6;
  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 26px 'Zen Kaku Gothic New'";
  ctx.fillText("同担拒否度", barX, y);
  ctx.fillStyle = oshi;
  ctx.font = "56px 'Dela Gothic One'";
  ctx.fillText(`${d}%`, barX, y+66);
  ctx.fillStyle = "#f2effa";
  ctx.font = "700 30px 'Zen Kaku Gothic New'";
  ctx.fillText(doutanTitle(d), barX+170, y+62);
  ctx.fillStyle = "#241c40";
  roundRect(ctx, barX, y+90, barW, barH, 9); ctx.fill();
  ctx.fillStyle = oshi;
  roundRect(ctx, barX, y+90, Math.max(barW*d/100, barH), barH, 9); ctx.fill();

  // フッタ
  ctx.textAlign = "center";
  ctx.fillStyle = "#8d86a8";
  ctx.font = "700 24px 'Zen Kaku Gothic New'";
  ctx.fillText("#推し活16タイプ診断", W/2, H-90);

  // ダウンロード
  const a = document.createElement("a");
  a.download = `oshikatsu_${code}.png`;
  a.href = cv.toDataURL("image/png");
  a.click();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ================= URL直リンク(シェアされた結果) ================= */

function tryLoadFromUrl(){
  const q = new URLSearchParams(location.search);
  const code = q.get("t"), p = q.get("p"), d = q.get("d");
  if(!code || !TYPES[code] || !p || p.length!==8 || d===null) return false;
  const pcts = [0,1,2,3].map(i=>{
    const n = parseInt(p.slice(i*2,i*2+2),10);
    return isNaN(n) ? 50 : Math.min(100,Math.max(0,n));
  });
  const dv = Math.min(100,Math.max(0,parseInt(d,10)||0));
  renderResult(code, pcts, dv);
  $("btn-x").style.display = "none"; // 他人の結果はシェアさせない
  $("btn-retry").textContent = "自分も診断してみる";
  show("scr-result");
  return true;
}

/* ================= イベント ================= */

initSwatches();
$("btn-start").onclick = startQuiz;
document.querySelectorAll(".ans").forEach(b=>{
  b.onclick = ()=>answer(parseInt(b.dataset.v,10));
});
$("btn-back").onclick = ()=>{ if(cur>0){ cur--; renderQ(); } };
$("btn-x").onclick = shareX;
$("btn-img").onclick = saveImage;
$("btn-retry").onclick = ()=>{
  history.replaceState(null,"",location.pathname);
  $("btn-x").style.display = "";
  $("btn-retry").textContent = "もう一度診断する";
  show("scr-start");
};
tryLoadFromUrl();
</script>
</body>
</html>
